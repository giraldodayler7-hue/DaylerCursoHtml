<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        meter{
            vertical-align: middle;
            margin-right: auto;
        }
        
    </style>
    <!-- Etiqueta output -->
    <form oninput="resultado.value=parseInt(a.value) + parseInt(b.value)">

        <input type="number" id="a" value="0">
        <input type="number" id="b" value="0">
        <output name="resultado" for="a b">0</output>

        <br><br>
        <!-- Etiqueta progress -->
        <label for="carga">Progreso de carga:</label>
        <progress id="carga" value="70" max="100">70%</progress>

        <br><br>
        <!-- Etiqueta meter -->
        <label for="disco">Uso de disco:</label>
        <meter id="disco" value="0.6" min="0" max="1">60%</meter>
        <br><br>
    </form>
    <div class="contenedor-horizontal">
    <meter value="0.75" min="0" max="1">75%</meter>
    <meter value="80" min="0" max="100" low="40" high="80" optimum="100">85 puntos</meter>
    <meter value="250" min="0" max="500" optimum="300">250/500</meter>
</div>
<form action="">
    <input    type="button"   value="Click me" onclick="msg()" />
    <input type="checkbox" name="" id=""><label for="">futbol</label>

    <input type="radio" name="" id="">blanco
    <br>
    <input type="date" name="Cita" min="2026-06-13">
    <br>
    <input type="datetime-local">
    <br>
    <input type="email"">
    <br>
    <input type="file" name="" id="">
    <br>
    <input type="file" hidden="" id="" multiple>
    <br>
    <input type="image" src="bart.jpeg" width="50px">
    <br>
    <input type="number">
    <br>
    <input type="range" name="Volumen" min="0" max="100" value="70s" step="5">
    <br>
    <input type="time">
    <br>
    <input type="reset">
    <br>
    <input type="search" name="Consulta" placeholder="Buscar..." autocomplete="off"  results="5">
    <br>
    <input type="number" name="edad" min="10" max="100" step="1" required>
    <br>
    <input type="range" list="tickmarks" />

<datalist id="tickmarks">
  <option value="0"></option>
  <option value="10"></option>
  <option value="20"></option>
  <option value="30"></option>
  <option value="40"></option>
  <option value="50"></option>
  <option value="60"></option>
  <option value="70"></option>
  <option value="80"></option>
  <option value="90"></option>
  <option value="100"></option>
</datalist>
<br>
<input type="week">
<br>
<input type="month">
<br>
<input type="url">
</form>
</body>

</html>
